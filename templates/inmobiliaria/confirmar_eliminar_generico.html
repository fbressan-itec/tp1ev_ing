<!-- template generico para eliminar/editar usuario, cita -->

{% extends 'base.html' %}

{% block title %}Confirmar Eliminación - InmoMint{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center mt-10">
    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        ⚠️
    </div>
    <h1 class="text-2xl font-black text-gray-900 mb-2">¿Confirmar eliminación?</h1>
    <p class="text-gray-500 text-sm mb-6">Está a punto de eliminar de forma permanente {{ nombre_objeto }}. Esta acción no se puede deshacer.</p>

    <form method="POST" class="space-y-3">
        {% csrf_token %}
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-colors cursor-pointer">
            ❌ Sí, Eliminar Registro
        </button>
        <a href="{% url url_cancelar %}" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors">
            Cancelar y Volver
        </a>
    </form>
</div>
{% endblock %}
