<!-- style base para el proyecto -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inmobiliaria{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'home' %}" class="text-xl font-bold tracking-wider">🏠 InmoMint</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="{% url 'lista_propiedades' %}" class="hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">Propiedades</a>
                    <a href="#" class="hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">Clientes</a>
                    
                    {% if user.is_authenticated %}
                        <span class="text-blue-200 text-sm font-medium hidden sm:inline">Hola, {{ user.username }}</span>
                        
                        {% if user.is_staff or user.es_agente %}
                            <a href="/admin/" class="hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">Admin</a>
                        {% endif %}
                        
                        <form method="POST" action="{% url 'logout' %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-md text-sm font-medium transition-colors cursor-pointer">
                                Salir
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="bg-blue-800 hover:bg-blue-900 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                            Iniciar Sesión
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 text-sm mt-auto">
        <p>&copy; 2026 InmoMint - Trabajo Práctico Ingeniería de Software</p>
    </footer>

</body>
</html>
